name: Build APK from zip
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.11.1 }
      - name: Unzip project
        run: |
          unzip -q NotifyControlPro-*.zip -d src
          echo "PROJ=$(dirname "$(find src -name settings.gradle.kts | head -1)")" >> "$GITHUB_ENV"
      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
